name: Android Mainline Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mainline Release
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelease \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: List generated APKs
        if: always()
        run: |
          find src/android -type f -name "*.apk" -print

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eden-mainline-release-${{ github.sha }}
          path: src/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
