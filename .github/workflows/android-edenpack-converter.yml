name: Build Android EdenPack Converter
on:
  push:
    branches: [feature/android-edenpack-converter]
    paths:
      - 'android-edenpack-converter/**'
      - '.github/workflows/android-edenpack-converter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-edenpack-converter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: edenpack-converter-debug-apk
          path: android-edenpack-converter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
