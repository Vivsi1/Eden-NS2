name: Build Android EdenPack Converter
on:
  push:
    branches: [feature/android-edenpack-converter]
    paths:
      - 'android-edenpack-converter/**'
      - '.github/workflows/android-edenpack-converter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu images already include the Android SDK.
      # Avoid android-actions/setup-android@v3, which can fail resolving
      # the obsolete "tools" package on some runner images.
      - name: Accept Android SDK licenses and install packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build debug APK
        working-directory: android-edenpack-converter
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: edenpack-converter-debug-apk
          path: android-edenpack-converter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
